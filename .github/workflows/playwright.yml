name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: E2E tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      STANDARD_USER_USERNAME: ${{ secrets.STANDARD_USER_USERNAME }}
      LOCKED_USER_USERNAME: ${{ secrets.LOCKED_USER_USERNAME }}
      PROBLEM_USER_USERNAME: ${{ secrets.PROBLEM_USER_USERNAME }}
      ERROR_USER_USERNAME: ${{ secrets.ERROR_USER_USERNAME }}
      VISUAL_USER_USERNAME: ${{ secrets.VISUAL_USER_USERNAME }}
      PERFORMANCE_USER_USERNAME: ${{secrets.PERFORMANCE_USER_USERNAME}}
      PASSWORD: ${{ secrets.PASSWORD }}

    strategy:
      matrix:
        browser: [chromium]

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci 

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      
    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-html-report-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 14

    - name: Upload JSON report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: json-test-results-${{ matrix.browser }}
        path: ./test-results/test-results.json
        retention-days: 14    
